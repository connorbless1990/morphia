<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphic Fields</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000500; color: #aaffaa; font-family: 'Courier New', monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Glass Panel UI */
        .glass-panel {
            background: rgba(0, 20, 10, 0.9);
            border: 1px solid #33ff33;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.2);
            border-radius: 2px;
        }

        /* Neon Sliders */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px;
            background: #33ff33; cursor: pointer; margin-top: -6px;
            box-shadow: 0 0 10px #33ff33; border-radius: 50%;
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 2px; background: #113311; }

        /* Buttons */
        .geo-btn { transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .geo-btn:hover { background: #33ff33; color: black; box-shadow: 0 0 15px #33ff33; }

        /* Overlay */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 class="text-5xl text-green-500 font-bold mb-4 tracking-widest text-center">MORPHIC RESONANCE</h1>
        <p class="text-gray-400 mb-8 text-sm text-center">
            The Field exists before the Form.<br>
            Observe the invisible.
        </p>
        <button id="ignite-btn" class="px-8 py-3 border border-green-500 text-green-500 hover:bg-green-500 hover:text-black transition-all uppercase tracking-widest font-bold">
            Initialize
        </button>
    </div>

    <div id="canvas-container"></div>

    <div class="absolute top-0 left-0 w-full h-full pointer-events-none p-4 flex flex-col justify-between z-10">

        <div class="glass-panel p-4 pointer-events-auto inline-block">
            <div class="text-xs text-green-600 font-bold mb-1">FIELD MONITOR</div>
            <div class="text-2xl font-bold tracking-tighter text-green-400" id="field-status">WAITING...</div>
            <div class="text-[10px] text-green-800 mt-1">ENTITIES: 4000</div>
        </div>

        <div class="glass-panel w-full md:w-80 p-6 pointer-events-auto self-end flex flex-col gap-6">

            <div>
                <div class="text-[10px] text-green-700 uppercase tracking-widest mb-2 border-b border-green-900 pb-1">Archetypes</div>
                <div class="grid grid-cols-3 gap-1">
                    <button class="geo-btn bg-black text-green-600 border border-green-900 text-[10px] py-2" data-shape="sphere">SEED</button>
                    <button class="geo-btn bg-black text-green-600 border border-green-900 text-[10px] py-2" data-shape="torus">TORUS</button>
                    <button class="geo-btn bg-black text-green-600 border border-green-900 text-[10px] py-2" data-shape="merkaba">MERKABA</button>
                    <button class="geo-btn bg-black text-green-600 border border-green-900 text-[10px] py-2" data-shape="spiral">SPIRAL</button>
                    <button class="geo-btn bg-black text-green-600 border border-green-900 text-[10px] py-2" data-shape="flower">FLOWER</button>
                    <button class="geo-btn bg-black text-green-600 border border-green-900 text-[10px] py-2" data-shape="scatter">VOID</button>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <div class="flex justify-between text-xs mb-1 text-green-400"><span>Resonance (Attraction)</span><span id="val-resonance">0.00</span></div>
                    <input type="range" id="resonance" min="0" max="1" step="0.01" value="0.0">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1 text-blue-400"><span>Vitality (Motion)</span><span id="val-vitality">0.50</span></div>
                    <input type="range" id="vitality" min="0" max="1" step="0.01" value="0.5">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1 text-yellow-400"><span>Evolution (Complexity)</span><span id="val-evolution">1.0</span></div>
                    <input type="range" id="evolution" min="1" max="5" step="0.1" value="1.0">
                </div>
            </div>

            <div class="border-t border-green-900 pt-4 flex justify-between items-center">
                <span class="text-[10px] text-green-700">AUDIO SYNTHESIS</span>
                <button id="audio-toggle" class="text-[10px] px-3 py-1 border border-green-800 text-green-800 hover:text-green-400 transition-colors">MUTED</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. UTILS ---
        const R = (min, max) => Math.random() * (max - min) + min;

        // --- 2. GHOST FIELD (The Mesh You Liked) ---
        // This class renders the wireframe blueprint so you can see the field itself.
        class GhostField {
            constructor(scene) {
                this.scene = scene;
                this.mesh = null;
                this.material = new THREE.MeshBasicMaterial({
                    color: 0x114411, // Dark green
                    wireframe: true,
                    transparent: true,
                    opacity: 0.15, // Subtle ghost effect
                    blending: THREE.AdditiveBlending
                });
            }

            updateShape(shapeName, evolution) {
                if(this.mesh) {
                    this.scene.remove(this.mesh);
                    if(this.mesh.geometry) this.mesh.geometry.dispose();
                }

                let geo;
                const scale = 1 + (evolution * 0.2);
                const complex = Math.floor(evolution);

                // Geometric definitions
                switch(shapeName) {
                    case 'torus': geo = new THREE.TorusKnotGeometry(2.5 * scale, 0.8, 120, 20); break;
                    case 'merkaba': geo = new THREE.OctahedronGeometry(3.5 * scale, complex - 1); break;
                    case 'flower': geo = new THREE.IcosahedronGeometry(3.0 * scale, complex); break;
                    case 'sphere': geo = new THREE.SphereGeometry(3.0 * scale, 32, 32); break;
                    case 'spiral': return; // Spiral has no mesh, only particles
                    case 'scatter': return; // Void has no mesh
                    default: return;
                }

                if(geo) {
                    this.mesh = new THREE.Mesh(geo, this.material);
                    this.scene.add(this.mesh);
                }
            }

            animate() {
                if(this.mesh) {
                    this.mesh.rotation.y += 0.002;
                    this.mesh.rotation.z += 0.001;
                }
            }
        }

        // --- 3. ARCHITECT (Calculates Particle Targets) ---
        class Architect {
            generateTargets(shapeName, count, evolution) {
                const targets = new Float32Array(count * 3);
                let geo;
                const scale = 1 + (evolution * 0.2);
                const complex = Math.max(1, Math.floor(evolution));

                // Same logic as GhostField but for points
                switch(shapeName) {
                    case 'torus': geo = new THREE.TorusKnotGeometry(2.5 * scale, 0.8, 150 * complex, 20 * complex); break;
                    case 'merkaba': geo = new THREE.OctahedronGeometry(3.5 * scale, complex - 1); break;
                    case 'flower': geo = new THREE.IcosahedronGeometry(3.0 * scale, complex * 2); break;
                    case 'sphere': geo = new THREE.SphereGeometry(3.0 * scale, 32 * complex, 32 * complex); break;
                    case 'spiral': this._spiral(targets, count, evolution); return targets;
                    case 'scatter': default: this._chaos(targets, count); return targets;
                }

                // Sample points from surface
                if(geo) {
                    const pos = geo.attributes.position;
                    for(let i=0; i<count; i++) {
                        const index = i % pos.count;
                        targets[i*3] = pos.getX(index);
                        targets[i*3+1] = pos.getY(index);
                        targets[i*3+2] = pos.getZ(index);
                    }
                    geo.dispose();
                }
                return targets;
            }

            _chaos(arr, count) {
                for(let i=0; i<count; i++) {
                    const r = 15 * Math.cbrt(Math.random());
                    const theta = R(0, Math.PI*2);
                    const phi = Math.acos(R(-1, 1));
                    arr[i*3] = r * Math.sin(phi) * Math.cos(theta);
                    arr[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                    arr[i*3+2] = r * Math.cos(phi);
                }
            }

            _spiral(arr, count, evolution) {
                const twist = evolution * 0.8;
                for(let i=0; i<count; i++) {
                    const t = i / count;
                    const angle = t * Math.PI * 20 * twist;
                    const r = t * 8;
                    arr[i*3] = r * Math.cos(angle);
                    arr[i*3+1] = (t - 0.5) * 10;
                    arr[i*3+2] = r * Math.sin(angle);
                }
            }
        }

        // --- 4. SWARM (The Particles) ---
        class Swarm {
            constructor(scene, count) {
                this.count = count;
                this.scene = scene;
                this.architect = new Architect();

                this.pos = new Float32Array(count * 3);
                this.vel = new Float32Array(count * 3);
                this.target = new Float32Array(count * 3);

                this.architect._chaos(this.pos, count);
                this.architect._chaos(this.target, count);

                // VISUAL UPGRADE: Bigger, brighter, glowing
                const geometry = new THREE.OctahedronGeometry(0.08, 0); // Crystal shape
                const material = new THREE.MeshBasicMaterial({
                    color: 0x66ff66,
                    wireframe: false
                });

                this.mesh = new THREE.InstancedMesh(geometry, material, count);
                this.mesh.frustumCulled = false; // Prevents flickering
                this.scene.add(this.mesh);

                this.dummy = new THREE.Object3D();
            }

            setShape(name, evo) {
                const newT = this.architect.generateTargets(name, this.count, evo);
                this.target.set(newT);
            }

            update(time, resonance, vitality) {
                const dt = 0.016;

                for(let i=0; i<this.count; i++) {
                    const ix=i*3, iy=i*3+1, iz=i*3+2;

                    // 1. Attraction Force (Resonance)
                    let fx = (this.target[ix] - this.pos[ix]) * resonance * 3.0;
                    let fy = (this.target[iy] - this.pos[iy]) * resonance * 3.0;
                    let fz = (this.target[iz] - this.pos[iz]) * resonance * 3.0;

                    // 2. Noise Force (Vitality) - Keeps them moving
                    const nScale = 0.5;
                    fx += Math.sin(this.pos[iy]*nScale + time) * vitality;
                    fy += Math.cos(this.pos[iz]*nScale + time) * vitality;
                    fz += Math.sin(this.pos[ix]*nScale + time) * vitality;

                    // 3. Physics Integration
                    this.vel[ix] += fx * dt;
                    this.vel[iy] += fy * dt;
                    this.vel[iz] += fz * dt;

                    // Dampening (Friction)
                    const friction = 0.94;
                    this.vel[ix] *= friction;
                    this.vel[iy] *= friction;
                    this.vel[iz] *= friction;

                    this.pos[ix] += this.vel[ix];
                    this.pos[iy] += this.vel[iy];
                    this.pos[iz] += this.vel[iz];

                    // 4. Render Instance
                    this.dummy.position.set(this.pos[ix], this.pos[iy], this.pos[iz]);

                    // Particles align with their velocity (flow look)
                    this.dummy.lookAt(this.pos[ix] + this.vel[ix], this.pos[iy] + this.vel[iy], this.pos[iz] + this.vel[iz]);

                    // Scale pulses with speed
                    const speed = Math.sqrt(this.vel[ix]**2 + this.vel[iy]**2);
                    // If stopped -> 80% size. If fast -> Stretch.
                    const s = 0.8 + Math.min(speed, 1.0);
                    this.dummy.scale.set(s, s, s*1.5);

                    this.dummy.updateMatrix();
                    this.mesh.setMatrixAt(i, this.dummy.matrix);
                }
                this.mesh.instanceMatrix.needsUpdate = true;
            }
        }

        // --- 5. APP CONTROLLER ---
        class App {
            constructor() {
                this.params = { resonance: 0.0, vitality: 0.5, evolution: 1.0 };
                this.currentShape = 'scatter';

                this.initScene();
                this.ghost = new GhostField(this.scene); // The Mesh
                this.swarm = new Swarm(this.scene, 4000); // The Particles
                this.initUI();
                this.animate();
            }

            initScene() {
                this.scene = new THREE.Scene();
                // Removed Fog so things are clearer against black
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
                this.camera.position.z = 12;

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x000500); // Very dark green/black
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            initUI() {
                // Sliders
                const link = (id, key) => {
                    document.getElementById(id).addEventListener('input', (e) => {
                        this.params[key] = parseFloat(e.target.value);
                        document.getElementById('val-'+id).innerText = this.params[key].toFixed(2);

                        // If Evolution changes, update blueprint
                        if(key === 'evolution') {
                            this.swarm.setShape(this.currentShape, this.params.evolution);
                            this.ghost.updateShape(this.currentShape, this.params.evolution);
                        }
                    });
                };
                link('resonance', 'resonance');
                link('vitality', 'vitality');
                link('evolution', 'evolution');

                // Buttons
                document.querySelectorAll('.geo-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.currentShape = e.target.dataset.shape;
                        this.swarm.setShape(this.currentShape, this.params.evolution);
                        this.ghost.updateShape(this.currentShape, this.params.evolution);
                        document.getElementById('field-status').innerText = this.currentShape.toUpperCase();
                    });
                });

                // Start
                document.getElementById('ignite-btn').addEventListener('click', () => {
                    document.getElementById('overlay').style.opacity = 0;
                    setTimeout(()=>document.getElementById('overlay').style.display='none', 1000);
                });
            }

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                const time = performance.now() * 0.001;

                this.swarm.update(time, this.params.resonance, this.params.vitality);
                this.ghost.animate();

                // Slow camera rotation
                this.scene.rotation.y = Math.sin(time * 0.1) * 0.2;
                this.scene.rotation.x = Math.cos(time * 0.15) * 0.1;

                this.renderer.render(this.scene, this.camera);
            }
        }

        new App();
    </script>
</body>
</html>
